name: Kiro Tech Debt Tracker

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9 AM UTC
  workflow_dispatch:

jobs:
  tech-debt-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Kiro Tech Debt Analysis
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kiro-cli chat --no-interactive --trust-tools=read,grep,glob \
            "Perform a tech debt analysis on this codebase:
          1) TODO/FIXME/HACK comments - find and categorize
          2) Deprecated API usage
          3) Code duplication patterns
          4) Outdated dependencies
          5) Missing test coverage for critical paths
          6) Security debt (weak patterns, missing validation)
          For each: location, category, priority (P1-P4), effort estimate.
          Summarize with Tech Debt Score (1-10) and top 5 items for next sprint." \
            > /tmp/tech-debt-report.md 2>&1 || true

      - name: Create tech debt issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Tech debt report not available.';
            try { report = fs.readFileSync('/tmp/tech-debt-report.md', 'utf8'); } catch(e) {}
            const title = `[Tech Debt] Weekly Report - ${new Date().toISOString().split('T')[0]}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## 🔧 Weekly Tech Debt Report\n\n${report}\n\n---\n*Auto-generated by Kiro CLI*`,
              labels: ['tech-debt', 'automated']
            });
