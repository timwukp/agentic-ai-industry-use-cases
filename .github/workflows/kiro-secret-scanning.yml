name: Kiro Secret Scanning

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed-files.txt
          else
            git diff --name-only HEAD~1 > /tmp/changed-files.txt
          fi
          echo "count=$(wc -l < /tmp/changed-files.txt | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Kiro Secret Scan
        if: steps.changed.outputs.count != '0'
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          FILES=$(cat /tmp/changed-files.txt | head -30)
          kiro-cli chat --no-interactive --trust-tools=read,grep,glob \
            "Scan these files for leaked secrets and credentials:
          $FILES
          Look for:
          1) API keys, tokens, passwords (AWS, GCP, Azure, GitHub, Slack)
          2) Private keys (RSA, SSH, PGP)
          3) Database connection strings with credentials
          4) Hardcoded IP addresses or internal URLs
          5) JWT tokens or session secrets
          6) .env file contents committed accidentally
          Report: file, line, type, severity, remediation." \
            > /tmp/review-secrets.md 2>&1 || true

      - name: Post secret scan results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review = 'Secret scan not available.';
            try { review = fs.readFileSync('/tmp/review-secrets.md', 'utf8'); } catch(e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔐 Kiro Secret Scanning\n\n${review}\n\n---\n*Powered by Kiro CLI*`
            });
