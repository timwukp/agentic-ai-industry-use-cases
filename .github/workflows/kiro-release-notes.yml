name: Kiro Release Notes Generation

on:
  release:
    types: [created]
  push:
    tags: ['v*']

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Get commits since last tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          git log ${PREV_TAG}..HEAD --pretty=format:"%h %s" > /tmp/commits.txt

      - name: Kiro Release Notes
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          COMMITS=$(cat /tmp/commits.txt)
          kiro-cli chat --no-interactive --trust-tools=read,grep \
            "Generate professional release notes from these commits:
          $COMMITS
          Format with sections:
          1) HIGHLIGHTS - Key features (user-facing language)
          2) SECURITY - Security fixes or improvements
          3) BUG FIXES - Resolved issues
          4) BREAKING CHANGES - Backward-incompatible changes
          5) DEPENDENCIES - Updated dependencies
          Flag security-relevant changes prominently." \
            > /tmp/release-notes.md 2>&1 || true

      - name: Update release body
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let notes = '';
            try { notes = fs.readFileSync('/tmp/release-notes.md', 'utf8'); } catch(e) {}
            if (notes) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                body: notes
              });
            }
