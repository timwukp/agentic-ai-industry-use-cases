name: SBOM & License Compliance

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tools
        run: pip install pip-licenses==5.0.0 cyclonedx-bom==7.3.1

      - name: Install project dependencies
        run: |
          pip install -e ".[dev]" 2>&1 | tee /tmp/pip-install.log || \
          pip install -e . 2>&1 | tee /tmp/pip-install.log || \
          echo "⚠️  Could not install project deps"

      - name: Generate SBOM (CycloneDX)
        run: |
          # cyclonedx-bom 7.x: JSON is selected via --output-format (no --format flag)
          cyclonedx-py environment -o sbom.json --output-format JSON
          if [ ! -s sbom.json ]; then
            echo "❌ SBOM generation failed — file is empty"
            exit 1
          fi
          echo "✅ SBOM generated"

      - name: License compliance check
        run: |
          echo "=== Dependency Licenses ==="
          pip-licenses --format=plain --order=license
          echo ""
          echo "=== Checking for problematic licenses ==="
          PROBLEMATIC=$(pip-licenses --format=csv | grep -iE "GPL|AGPL|SSPL" | grep -v "LGPL" || true)
          if [ -n "$PROBLEMATIC" ]; then
            echo "⚠️  Found potentially restrictive licenses:"
            echo "$PROBLEMATIC"
            echo "Please review license compatibility."
            exit 1
          else
            echo "✅ No problematic licenses found."
          fi

      - name: Upload SBOM artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
