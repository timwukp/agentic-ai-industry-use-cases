[project]
name = "agentic-ai-industry-use-cases"
version = "3.0.0"
description = "Industry agentic AI use cases on AWS Bedrock AgentCore Harness — declarative agents, Gateway MCP tools, Knowledge Base, Cognito-secured PWA"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.43.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
    "ruff>=0.4",
]
infra = [
    "aws-cdk-lib>=2.263.0",
    "constructs>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/infra"]

[tool.ruff]
line-length = 100
